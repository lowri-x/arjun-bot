name: Arjun Cloud Scanner

on:
  schedule:
    # ਇਹ ਸਿਰਫ਼ ਸਵੇਰੇ 9:00 ਤੋਂ ਦੁਪਹਿਰ 3:30 ਤੱਕ ਹੀ ਚੱਲੇਗਾ (ਸੋਮਵਾਰ ਤੋਂ ਸ਼ੁੱਕਰਵਾਰ)
    # ਭਾਰਤੀ ਸਮਾਂ (IST) = UTC + 5:30
    # 9:00 AM IST = 3:30 AM UTC
    # 3:30 PM IST = 10:00 AM UTC
    - cron: '*/5 3-9 * * 1-5' 
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # ਟੈਸਟ ਲਈ

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install requests pandas smartapi-python pyotp logzero websocket-client
      - name: Run Arjun Scanner
        env:
          API_KEY: ${{ secrets.API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python -u arjun_cloud.py
