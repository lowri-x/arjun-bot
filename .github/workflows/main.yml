name: Arjun Cloud Scanner

on:
  schedule:
    # ਇਹ ਹਰ 5 ਮਿੰਟ ਬਾਅਦ ਚੱਲੇਗਾ (ਸਵੇਰੇ 9:00 ਤੋਂ ਦੁਪਹਿਰ 3:30 ਵਜੇ ਤੱਕ, ਸੋਮਵਾਰ ਤੋਂ ਸ਼ੁੱਕਰਵਾਰ)
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch: # ਤੁਸੀਂ ਖੁਦ ਵੀ ਟੈਸਟ ਕਰਨ ਲਈ ਚਲਾ ਸਕਦੇ ਹੋ

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas smartapi-python pyotp logzero websocket-client

      - name: Run Arjun Scanner
        env:
          API_KEY: ${{ secrets.API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python arjun_cloud.py
