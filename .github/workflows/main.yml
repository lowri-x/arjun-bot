name: Arjun V2.0 Live Bot

on:
  schedule:
    # 9:10 AM IST (03:40 UTC)
    - cron: '40 3 * * 1-5' 
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    # 355 ਮਿੰਟ (GitHub ਦੀ 360 ਮਿੰਟ ਦੀ ਹੱਦ ਤੋਂ ਘੱਟ)
    timeout-minutes: 355 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Arjun Bot
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
