name: Arjun Live Signal Bot

on:
  schedule:
    # 03:15 AM UTC is 08:45 AM IST (Start 15 mins early to avoid GitHub delay)
    - cron: '15 3 * * 1-5' 
  workflow_dispatch: # To run manually

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 400 # Max 6 hours 40 mins (Covers full market)
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Live Engine
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python live_feed.py
