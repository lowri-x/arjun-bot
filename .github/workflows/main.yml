name: Arjun Cloud Scanner V3

on:
  schedule:
    # 🚀 ਸੈਸ਼ਨ 1: 8:52 AM IST (3:22 AM UTC)
    - cron: '22 3 * * 1-5'
    # 🚀 ਸੈਸ਼ਨ 2: 12:30 PM IST (7:00 AM UTC) - ਓਵਰਲੈਪ ਤੋਂ ਬਚਣ ਲਈ 12:47 ਤੋਂ ਪਹਿਲਾਂ
    - cron: '0 7 * * 1-5'
    # 🚀 ਕਲੋਜਿੰਗ ਮੈਸੇਜ: 3:20 PM IST (9:50 AM UTC)
    - cron: '50 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: arjun-options-scanner-v3
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # 🚨 timeout 215 (3.5 ਘੰਟੇ) ਤਾਂਕਿ ਸੈਸ਼ਨ 1, 12:27 ਵਜੇ ਖਤਮ ਹੋ ਜਾਵੇ
    timeout-minutes: 215 

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Arjun scanner
        env:
          API_KEY: ${{ secrets.API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          # 🚨 MAX_RISK 2000 ਕਰ ਦਿੱਤਾ ਹੈ
          MAX_RISK_PER_TRADE: '2000'
          POLL_SECONDS: '300'
        run: python -u arjun_cloud.py
